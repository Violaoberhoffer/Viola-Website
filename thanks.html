<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Viola C. Oberhoffer</title>
<meta name="description" content="Viola C. Oberhoffer – romantasy author and voice actress.">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<style>
@font-face{font-family:'Cormorant Garamond';src:url(fonts/cormorant-garamond.woff) format('woff');font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url(fonts/cormorant-garamond-italic.woff) format('woff');font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:'Manrope';src:url(fonts/manrope.woff) format('woff');font-weight:200 800;font-style:normal;font-display:swap}
body{margin:0;background:#141221}
a{color:#EFE6D6}a:hover{color:#C9B8DE}
.frame-bg{background-image:url(images/ornament-frame.jpg);background-size:100% 100%;background-repeat:no-repeat}
.quote-bg{position:absolute;inset:0;background-image:url(images/ornament-frame.jpg);background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none}
.orn{position:absolute;top:0;bottom:0;width:42%;background-image:url(images/ornament-frame.jpg);background-repeat:no-repeat;background-size:auto 130%;pointer-events:none}
.orn-l{left:0;background-position:0% 50%;-webkit-mask-image:linear-gradient(to right,#000 30%,transparent);mask-image:linear-gradient(to right,#000 30%,transparent)}
.orn-r{right:0;background-position:100% 50%;-webkit-mask-image:linear-gradient(to left,#000 30%,transparent);mask-image:linear-gradient(to left,#000 30%,transparent)}
html{scroll-behavior:smooth}
.quote-sec{aspect-ratio:2576/1614}
@media (max-width:900px){.quote-sec{aspect-ratio:auto}}
img{max-width:100%}
@media (max-width:700px){
 header,section>div,section>figure,#voice,#about,#top,footer{padding-left:20px!important;padding-right:20px!important}
 #top,#voice,#about{padding-top:56px!important;padding-bottom:56px!important}
 section>div{padding-top:72px!important;padding-bottom:72px!important}
 h1{font-size:38px!important}
 h2,h2>span:first-child{font-size:40px!important}
 h3{font-size:32px!important}
 blockquote,blockquote>span{font-size:30px!important}
 blockquote>span:last-child{font-size:34px!important}
 nav{column-gap:22px!important;font-size:13px!important;letter-spacing:.14em!important}
 #books a[aria-label]{right:-8px!important;top:-24px!important;transform:scale(.85)}
 #books div[style*="left: -36px"]{left:-8px!important;transform:scale(.85)}
 #letters>div>div{padding:64px 24px 40px!important}
 header>div[role=group]{top:4px!important;right:12px!important}
}
@media (prefers-reduced-motion: no-preference){
 .js .rv{opacity:0;transform:translateY(22px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
 .js .rv.in{opacity:1;transform:none}
 .js .rv-soft{opacity:0;transition:opacity 1.6s ease;transition-delay:var(--d,0s)}
 .js .rv-soft.in{opacity:1}
 .orn{animation:orn-drift 11s ease-in-out infinite alternate;will-change:transform}
 .orn-r{animation-name:orn-drift-r;animation-delay:-5s}
 @keyframes orn-drift{0%{transform:translate3d(-10px,12px,0) scale(1) rotate(-1deg)}50%{transform:translate3d(14px,-22px,0) scale(1.07) rotate(0.6deg)}100%{transform:translate3d(-4px,-44px,0) scale(1.12) rotate(1.4deg)}}
 @keyframes orn-drift-r{0%{transform:translate3d(10px,12px,0) scale(1) rotate(1deg)}50%{transform:translate3d(-14px,-22px,0) scale(1.07) rotate(-0.6deg)}100%{transform:translate3d(4px,-44px,0) scale(1.12) rotate(-1.4deg)}}
 .quote-bg{animation:quote-breathe 24s ease-in-out infinite alternate;will-change:transform}
 @keyframes quote-breathe{0%{transform:scale(1)}100%{transform:scale(1.06)}}
}
@media (prefers-reduced-motion: no-preference){
 .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 4.5s ease-in-out infinite;animation-delay:var(--tw,0s)}
 @keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.35;transform:scale(.7)}55%{opacity:1;transform:scale(1.25);filter:drop-shadow(0 0 3px #F3D9A6)}}
 .shimmer{background:linear-gradient(105deg,#EFE6D6 0%,#EFE6D6 42%,#F7DDA8 50%,#FFF7E6 52%,#EFE6D6 60%,#EFE6D6 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 2.6s ease-in-out .5s 1 forwards}
 @keyframes shimmer{to{background-position:0% 0}}
}
.embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (hover:hover) and (prefers-reduced-motion: no-preference){
 a[style*="border-radius: 999px"]:not([aria-label]),button{transition:transform .35s ease,box-shadow .35s ease,background-color .35s ease}
 a[style*="border-radius: 999px"]:not([aria-label]):hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(201,184,222,.22),0 0 0 1px rgba(201,184,222,.35)}
 article,#voice div:has(> audio){transition:transform .45s ease,box-shadow .45s ease,border-color .45s ease}
 article:hover,#voice div:has(> audio):hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 28px rgba(201,184,222,.12);border-color:#6E6288!important}
 #books img{transition:transform .6s ease,box-shadow .6s ease}
 #books img:hover{transform:perspective(900px) rotateY(-5deg) rotateX(2deg) scale(1.02);box-shadow:0 36px 70px rgba(0,0,0,.55),0 0 40px rgba(240,160,90,.18)}
 #books a[aria-label]:hover{animation:wiggle .7s ease}
 @keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-6deg}50%{rotate:5deg}75%{rotate:-2deg}}
}
html,body{overflow-x:clip}
.sky{position:absolute;top:0;left:50%;width:100vw;margin-left:-50vw;height:100%;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
@media (prefers-reduced-motion: no-preference){
 .mono{animation:mono-in 2.2s cubic-bezier(.2,.7,.2,1) both,mono-glow 6s ease-in-out 2.2s infinite}
 @keyframes mono-in{0%{opacity:0;transform:translateY(10px) scale(.92);filter:drop-shadow(0 0 0 rgba(243,217,166,0))}60%{opacity:1;filter:drop-shadow(0 0 18px rgba(243,217,166,.75))}100%{opacity:1;transform:none;filter:drop-shadow(0 0 6px rgba(201,184,222,.35))}}
 @keyframes mono-glow{0%,100%{filter:drop-shadow(0 0 6px rgba(201,184,222,.35))}50%{filter:drop-shadow(0 0 14px rgba(243,217,166,.55))}}
 .shimmer.name{animation:name-in 2.4s cubic-bezier(.2,.7,.2,1) .5s both,shimmer 2.6s ease-in-out 2.4s 1 forwards}
 @keyframes name-in{0%{opacity:0;transform:scale(1.12);filter:blur(12px)}100%{opacity:1;transform:none;filter:blur(0)}}
 .topnav{animation:nav-in 1.4s ease 1.9s both}
 @keyframes nav-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.quote-top{aspect-ratio:auto!important;min-height:0!important;height:clamp(440px,66vh,640px)}
.quote-top .quote-bg{background-size:100% 100%}
.quote-top figure{padding:64px 48px!important}
@media (max-width:700px){.quote-top{height:auto}.quote-top figure{padding:88px 28px!important}}
@media (max-width:700px){#audiobooks{padding:40px 22px!important;gap:32px!important}}
.pricing-info summary::-webkit-details-marker{display:none}
.pricing-info[open] .pi-plus{transform:rotate(45deg)}
.pi-plus{transition:transform .3s ease}
.pricing-info summary:hover{background:#221C33}
@media (max-width:700px){.pricing-info summary{padding:20px 20px!important}.pricing-info>div{padding:4px 20px 28px!important}}
#audition label{flex:1 1 200px;min-width:0}
#audition input:focus,#audition textarea:focus{outline:2px solid #C9B8DE;outline-offset:1px}
#audition button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,184,222,.25)}
@media (max-width:700px){#audition{padding:36px 22px!important}}
</style>
</head>
<body>
<main style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 64px 24px; text-align: center; font-family: 'Manrope', system-ui, sans-serif; color: #EFE6D6; background: #141221">
<img src="images/monogram.svg" alt="" style="width: 80px; height: 128px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 48px; line-height: 1.1">Thank you!</h1>
<p style="margin: 0; max-width: 520px; font-size: 18px; line-height: 1.7; color: #D8CFC0">Your request has arrived. I’ll read your pages and get back to you personally.</p>
<p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-style: italic; color: #EFE6D6">– Viola</p>
<a href="/" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 999px; border: 1px solid #8A7CA6; color: #EFE6D6; text-decoration: none; font-weight: 600; font-size: 15px">Back to the website</a>
</main>
</body>
</html>
